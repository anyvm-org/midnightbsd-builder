
VM_RELEASE=4.0.7

VM_ISO_LINK="https://midnightbsd.org/ftp/MidnightBSD/releases/amd64/ISO-IMAGES/4.0.7/MidnightBSD-4.0.7--amd64-disc1.iso"
VM_OS_NAME="midnightbsd"
VM_SSH_PORT=2227


VM_ROOT_PASSWORD=midnightbsd

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"

VM_INSTALL_CMD="mport install "

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fusefs-sshfs"

#mport installs sshfs with warnings, so it exists with 1, not 0
VM_PRE_INSTALL_PKGS="tree rsync fusefs-sshfs || true"

VM_LOGIN_TAG="idnightBSD/amd64"


VM_NIC=virtio

VM_OPTS="conf/midnightbsd-4.0.4.resp"




VM_SYNC_METHODS="rsync,scp,sshfs,nfs"
